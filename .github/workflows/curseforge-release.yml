name: Publish CurseForge

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to upload. Do not reuse a tag already published on CurseForge.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.repository }}-${{ github.event.workflow_run.id || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CurseForge release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}

      - name: Resolve CurseForge release metadata
        id: release_metadata
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          TRIGGER_EVENT: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          project_version="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties | tr -d '\r')"
          archive_name="$(awk -F= '$1 == "archives_base_name" { print $2 }' gradle.properties | tr -d '\r')"
          minecraft_1_21_1_fabric="$(awk -F= '$1 == "minecraft_version" { print $2 }' versions/1.21.1-fabric/gradle.properties | tr -d '\r')"
          minecraft_1_21_1_neoforge="$(awk -F= '$1 == "minecraft_version" { print $2 }' versions/1.21.1-neoforge/gradle.properties | tr -d '\r')"
          minecraft_1_21_11="$(awk -F= '$1 == "minecraft_version" { print $2 }' gradle.properties | tr -d '\r')"
          minecraft_26_2="$(awk -F= '$1 == "minecraft_version" { print $2 }' versions/26.2/gradle.properties | tr -d '\r')"

          if [[ -z "${project_version}" || -z "${archive_name}" || \
                -z "${minecraft_1_21_1_fabric}" || -z "${minecraft_1_21_1_neoforge}" || \
                -z "${minecraft_1_21_11}" || -z "${minecraft_26_2}" ]]; then
            echo "::error::The mod version, archive name and all Minecraft versions must be set."
            exit 1
          fi

          if [[ "${minecraft_1_21_1_fabric}" != "${minecraft_1_21_1_neoforge}" ]]; then
            echo "::error::The Fabric and NeoForge 1.21.1 targets must use the same Minecraft version."
            exit 1
          fi

          expected_tag="v${project_version}"
          release_tag="${MANUAL_TAG:-${expected_tag}}"
          should_publish="true"

          if [[ "${release_tag}" != "${expected_tag}" ]]; then
            echo "::error file=gradle.properties::Tag ${release_tag} does not match mod_version ${project_version}. Expected ${expected_tag}."
            exit 1
          fi

          if [[ "${TRIGGER_EVENT}" == "workflow_run" ]]; then
            tagged_commit="$(gh api "repos/${GH_REPO}/commits/${expected_tag}" --jq '.sha')"

            if [[ "${tagged_commit}" != "${WORKFLOW_HEAD_SHA}" ]]; then
              should_publish="false"
              echo "Tag ${expected_tag} does not point to this Release workflow commit. No CurseForge upload is needed."
            fi
          fi

          normalized_version="${project_version,,}"
          if [[ "${normalized_version}" == *alpha* ]]; then
            release_type="alpha"
          elif [[ "${normalized_version}" == *beta* || "${normalized_version}" == *rc* || "${normalized_version}" == *pre* || "${normalized_version}" == *-* ]]; then
            release_type="beta"
          else
            release_type="release"
          fi

          {
            echo "version=${project_version}"
            echo "minecraft_1_21_1=${minecraft_1_21_1_fabric}"
            echo "minecraft_1_21_11=${minecraft_1_21_11}"
            echo "minecraft_26_2=${minecraft_26_2}"
            echo "tag=${release_tag}"
            echo "jar_1_21_1_fabric_name=${archive_name}-${project_version}+mc1.21.1-fabric.jar"
            echo "jar_1_21_1_neoforge_name=${archive_name}-${project_version}+mc1.21.1-neoforge.jar"
            echo "jar_1_21_11_fabric_name=${archive_name}-${project_version}+mc1.21.11.jar"
            echo "jar_26_2_fabric_name=${archive_name}-${project_version}+mc26.2.jar"
            echo "checksum_1_21_1_fabric_name=${archive_name}-${project_version}+mc1.21.1-fabric.jar.sha256"
            echo "checksum_1_21_1_neoforge_name=${archive_name}-${project_version}+mc1.21.1-neoforge.jar.sha256"
            echo "checksum_1_21_11_fabric_name=${archive_name}-${project_version}+mc1.21.11.jar.sha256"
            echo "checksum_26_2_fabric_name=${archive_name}-${project_version}+mc26.2.jar.sha256"
            echo "release_type=${release_type}"
            echo "should_publish=${should_publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download and verify GitHub release assets
        if: steps.release_metadata.outputs.should_publish == 'true'
        shell: bash
        env:
          CHECKSUM_1_21_1_FABRIC_NAME: ${{ steps.release_metadata.outputs.checksum_1_21_1_fabric_name }}
          CHECKSUM_1_21_1_NEOFORGE_NAME: ${{ steps.release_metadata.outputs.checksum_1_21_1_neoforge_name }}
          CHECKSUM_1_21_11_FABRIC_NAME: ${{ steps.release_metadata.outputs.checksum_1_21_11_fabric_name }}
          CHECKSUM_26_2_FABRIC_NAME: ${{ steps.release_metadata.outputs.checksum_26_2_fabric_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          JAR_1_21_1_FABRIC_NAME: ${{ steps.release_metadata.outputs.jar_1_21_1_fabric_name }}
          JAR_1_21_1_NEOFORGE_NAME: ${{ steps.release_metadata.outputs.jar_1_21_1_neoforge_name }}
          JAR_1_21_11_FABRIC_NAME: ${{ steps.release_metadata.outputs.jar_1_21_11_fabric_name }}
          JAR_26_2_FABRIC_NAME: ${{ steps.release_metadata.outputs.jar_26_2_fabric_name }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --pattern "${JAR_1_21_1_FABRIC_NAME}" \
            --pattern "${CHECKSUM_1_21_1_FABRIC_NAME}" \
            --pattern "${JAR_1_21_1_NEOFORGE_NAME}" \
            --pattern "${CHECKSUM_1_21_1_NEOFORGE_NAME}" \
            --pattern "${JAR_1_21_11_FABRIC_NAME}" \
            --pattern "${CHECKSUM_1_21_11_FABRIC_NAME}" \
            --pattern "${JAR_26_2_FABRIC_NAME}" \
            --pattern "${CHECKSUM_26_2_FABRIC_NAME}" \
            --dir dist

          for asset_name in \
            "${JAR_1_21_1_FABRIC_NAME}" "${CHECKSUM_1_21_1_FABRIC_NAME}" \
            "${JAR_1_21_1_NEOFORGE_NAME}" "${CHECKSUM_1_21_1_NEOFORGE_NAME}" \
            "${JAR_1_21_11_FABRIC_NAME}" "${CHECKSUM_1_21_11_FABRIC_NAME}" \
            "${JAR_26_2_FABRIC_NAME}" "${CHECKSUM_26_2_FABRIC_NAME}"; do
            if [[ ! -s "dist/${asset_name}" ]]; then
              echo "::error::The GitHub release is missing ${asset_name}."
              exit 1
            fi
          done

          (
            cd dist
            sha256sum --check "${CHECKSUM_1_21_1_FABRIC_NAME}"
            sha256sum --check "${CHECKSUM_1_21_1_NEOFORGE_NAME}"
            sha256sum --check "${CHECKSUM_1_21_11_FABRIC_NAME}"
            sha256sum --check "${CHECKSUM_26_2_FABRIC_NAME}"
          )

      - name: Prepare CurseForge metadata
        if: steps.release_metadata.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MINECRAFT_1_21_1: ${{ steps.release_metadata.outputs.minecraft_1_21_1 }}
          MINECRAFT_1_21_11: ${{ steps.release_metadata.outputs.minecraft_1_21_11 }}
          MINECRAFT_26_2: ${{ steps.release_metadata.outputs.minecraft_26_2 }}
          PROJECT_VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_TYPE: ${{ steps.release_metadata.outputs.release_type }}
        run: |
          set -euo pipefail

          gh release view "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --json body \
            --jq '.body' > dist/changelog.md

          if [[ ! -s dist/changelog.md ]]; then
            printf 'Release %s\n' "${RELEASE_TAG}" > dist/changelog.md
          fi

          create_metadata() {
            local minecraft_version="$1"
            local loader="$2"
            local output_path="$3"

            if [[ "${loader}" == "Fabric" ]]; then
              relations='[
                {"slug": "fabric-api", "type": "requiredDependency"},
                {"slug": "modmenu", "type": "optionalDependency"},
                {"slug": "cloth-config", "type": "optionalDependency"}
              ]'
            else
              relations='[
                {"slug": "cloth-config", "type": "optionalDependency"}
              ]'
            fi

            jq -n \
              --rawfile changelog dist/changelog.md \
              --arg display_name "Ore Height Indicator ${PROJECT_VERSION} for Minecraft ${minecraft_version} (${loader})" \
              --arg loader "${loader}" \
              --arg minecraft_version "${minecraft_version}" \
              --arg release_type "${RELEASE_TYPE}" \
              --argjson relations "${relations}" \
              '{
                changelog: $changelog,
                changelogType: "markdown",
                displayName: $display_name,
                gameVersionNames: [$minecraft_version, $loader, "Client"],
                releaseType: $release_type,
                relations: {
                  projects: $relations
                }
              }' > "${output_path}"
          }

          create_metadata "${MINECRAFT_1_21_1}" "Fabric" dist/curseforge-metadata-1.21.1-fabric.json
          create_metadata "${MINECRAFT_1_21_1}" "NeoForge" dist/curseforge-metadata-1.21.1-neoforge.json
          create_metadata "${MINECRAFT_1_21_11}" "Fabric" dist/curseforge-metadata-1.21.11-fabric.json
          create_metadata "${MINECRAFT_26_2}" "Fabric" dist/curseforge-metadata-26.2-fabric.json

      - name: Upload the CurseForge release
        if: steps.release_metadata.outputs.should_publish == 'true'
        id: curseforge_upload
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          JAR_1_21_1_FABRIC_NAME: ${{ steps.release_metadata.outputs.jar_1_21_1_fabric_name }}
          JAR_1_21_1_NEOFORGE_NAME: ${{ steps.release_metadata.outputs.jar_1_21_1_neoforge_name }}
          JAR_1_21_11_FABRIC_NAME: ${{ steps.release_metadata.outputs.jar_1_21_11_fabric_name }}
          JAR_26_2_FABRIC_NAME: ${{ steps.release_metadata.outputs.jar_26_2_fabric_name }}
          MINECRAFT_1_21_1: ${{ steps.release_metadata.outputs.minecraft_1_21_1 }}
          MINECRAFT_1_21_11: ${{ steps.release_metadata.outputs.minecraft_1_21_11 }}
          MINECRAFT_26_2: ${{ steps.release_metadata.outputs.minecraft_26_2 }}
          PROJECT_VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_metadata.outputs.release_type }}
        run: |
          set -euo pipefail

          if [[ -z "${CURSEFORGE_API_TOKEN}" ]]; then
            echo "::error::CURSEFORGE_API_TOKEN is not configured as a GitHub Actions secret."
            exit 1
          fi

          if [[ ! "${CURSEFORGE_PROJECT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::CURSEFORGE_PROJECT_ID must be configured as a numeric GitHub Actions variable."
            exit 1
          fi

          upload_file() {
            local jar_name="$1"
            local metadata_path="$2"
            local response_file
            local metadata_json
            local http_status

            response_file="$(mktemp)"
            metadata_json="$(jq -c '.' "${metadata_path}")"
            http_status="$(
              curl --silent --show-error \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                --request POST \
                --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
                --form-string "metadata=${metadata_json}" \
                --form "file=@dist/${jar_name};type=application/java-archive" \
                "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file"
            )"

            if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::CurseForge rejected ${jar_name} with HTTP ${http_status}." >&2
              cat "${response_file}" >&2
              rm -f "${response_file}"
              return 1
            fi

            jq -er '.id' "${response_file}"
            rm -f "${response_file}"
          }

          file_1_21_1_fabric_id="$(upload_file "${JAR_1_21_1_FABRIC_NAME}" dist/curseforge-metadata-1.21.1-fabric.json)"
          file_1_21_1_neoforge_id="$(upload_file "${JAR_1_21_1_NEOFORGE_NAME}" dist/curseforge-metadata-1.21.1-neoforge.json)"
          file_1_21_11_fabric_id="$(upload_file "${JAR_1_21_11_FABRIC_NAME}" dist/curseforge-metadata-1.21.11-fabric.json)"
          file_26_2_fabric_id="$(upload_file "${JAR_26_2_FABRIC_NAME}" dist/curseforge-metadata-26.2-fabric.json)"
          {
            echo "file_1_21_1_fabric_id=${file_1_21_1_fabric_id}"
            echo "file_1_21_1_neoforge_id=${file_1_21_1_neoforge_id}"
            echo "file_1_21_11_fabric_id=${file_1_21_11_fabric_id}"
            echo "file_26_2_fabric_id=${file_26_2_fabric_id}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## CurseForge release"
            echo
            echo "- Version: ${PROJECT_VERSION}"
            echo "- Release type: ${RELEASE_TYPE}"
            echo "- Minecraft ${MINECRAFT_1_21_1} Fabric: file ID ${file_1_21_1_fabric_id}"
            echo "- Minecraft ${MINECRAFT_1_21_1} NeoForge: file ID ${file_1_21_1_neoforge_id}"
            echo "- Minecraft ${MINECRAFT_1_21_11} Fabric: file ID ${file_1_21_11_fabric_id}"
            echo "- Minecraft ${MINECRAFT_26_2} Fabric: file ID ${file_26_2_fabric_id}"
          } >> "${GITHUB_STEP_SUMMARY}"
