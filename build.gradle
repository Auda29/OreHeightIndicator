plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.9.0'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc1.21.11"
}

// Minotaur publishes the immutable JARs downloaded from a GitHub Release in CI.
// The defaults keep `./gradlew modrinth` useful for local development without
// putting credentials or a project ID in source control.
def modrinthProperty = { String name, String fallback ->
    def value = findProperty(name)
    return value == null ? fallback : value.toString()
}
def modrinthUploadPath = findProperty('modrinth_upload_file')
def modrinthAdditionalPath = findProperty('modrinth_additional_file')
def modrinthChangelogPath = findProperty('modrinth_changelog_file')
def modrinthGameVersions = modrinthProperty('modrinth_game_versions', project.minecraft_version)
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = modrinthProperty('modrinth_project_id', '')
    versionNumber = modrinthProperty('modrinth_version_number', project.version.toString())
    versionName = modrinthProperty('modrinth_version_name', "Ore Height Indicator ${project.version}")
    versionType = modrinthProperty('modrinth_version_type', 'release')
    changelog = modrinthChangelogPath
        ? file(modrinthChangelogPath).getText('UTF-8')
        : 'No changelog was specified.'
    uploadFile = modrinthUploadPath ? file(modrinthUploadPath) : tasks.remapJar
    additionalFiles = modrinthAdditionalPath ? [file(modrinthAdditionalPath)] : []
    gameVersions = modrinthGameVersions
    loaders = ['fabric']
    autoAddDependsOn = false
    debugMode = Boolean.parseBoolean(modrinthProperty('modrinth_debug', 'false'))

    dependencies {
        required.project 'fabric-api'
        optional.project 'modmenu'
        optional.project 'cloth-config'
    }
}

// Minotaur normally runs `assemble` before every upload. CI passes immutable
// GitHub Release assets explicitly, so clear that default only for this path.
afterEvaluate {
    if (modrinthUploadPath) {
        tasks.named('modrinth') {
            setDependsOn([])
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
